# ============================================================
# QTC ProcessTensor Lite V0.2
# Scientific Validation Configuration
# ============================================================

# ------------------------------------------------------------
# Time Evolution
# ------------------------------------------------------------

dt: 0.05
steps: 20

# ------------------------------------------------------------
# Reproducibility
# ------------------------------------------------------------

seed: 42

# ------------------------------------------------------------
# Compression Benchmark
# ------------------------------------------------------------

chi_list:
  - 1
  - 2
  - 4
  - 6
  - 8
  - 12
  - 16

# ------------------------------------------------------------
# Memory Kernel
# ------------------------------------------------------------

memory_strength: 0.10

memory_grid:
  - 0.00
  - 0.05
  - 0.10
  - 0.15
  - 0.20
  - 0.25
  - 0.30

# ------------------------------------------------------------
# Numerical Noise
# ------------------------------------------------------------

eps: 0.0

# ------------------------------------------------------------
# Divergence Detector
# ------------------------------------------------------------

warmup: 2

persistent_threshold: 0.20

# ------------------------------------------------------------
# Physicality Diagnostics
# ------------------------------------------------------------

trace_tol: 1.0e-8
eig_tol: 1.0e-8

# ------------------------------------------------------------
# Matrix Dimension
# ------------------------------------------------------------

dimension: 16

# ------------------------------------------------------------
# Output Control
# ------------------------------------------------------------

save_surface: true
save_plot: true
save_logs: true

surface_file: "data/result.npy"
plot_file: "figures/divergence_landscape.png"

# ------------------------------------------------------------
# Validation Thresholds
# ------------------------------------------------------------

markov_limit_tol: 1.0e-12
determinism_tol: 1.0e-12

# ------------------------------------------------------------
# Version Metadata
# ------------------------------------------------------------

project: "QTC ProcessTensor Lite"
version: "V0.2"
status: "Scientific Validation"